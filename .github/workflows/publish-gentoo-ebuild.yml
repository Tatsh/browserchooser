---
jobs:
  create-ebuild-pr:
    if: '!github.event.release.draft && !github.event.release.prerelease'
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG="$TAG_NAME"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Checkout gentoo/gentoo repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: gentoo
          persist-credentials: false
          repository: gentoo/gentoo
          token: ${{ secrets.GENTOO_TOKEN }}
      - name: Configure git
        run: |
          cd gentoo
          git config user.name "Andrew Udvare"
          git config user.email "audvare@gmail.com"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        name: Create new ebuild
        run: |
          cd gentoo
          EBUILD_DIR=x11-misc/browserchooser
          LATEST=$(find "$EBUILD_DIR" -name 'browserchooser-*.ebuild' 2>/dev/null | sort -V | tail -1)
          cp "$LATEST" "${EBUILD_DIR}/browserchooser-${VERSION}.ebuild"
          TARBALL_NAME="browserchooser-${VERSION}.tar.gz"
          TARBALL_PATH="$RUNNER_TEMP/${TARBALL_NAME}"
          curl -fSL -o "$TARBALL_PATH" \
            "https://github.com/Tatsh/browserchooser/archive/refs/tags/v${VERSION}.tar.gz"
          SIZE=$(stat -c%s "$TARBALL_PATH")
          BLAKE2B=$(b2sum "$TARBALL_PATH" | awk '{print $1}')
          SHA512=$(sha512sum "$TARBALL_PATH" | awk '{print $1}')
          MANIFEST="${EBUILD_DIR}/Manifest"
          NEW_LINE="DIST ${TARBALL_NAME} ${SIZE} BLAKE2B ${BLAKE2B} SHA512 ${SHA512}"
          if [[ -f "$MANIFEST" ]]; then
            grep -v "^DIST ${TARBALL_NAME} " "$MANIFEST" > "${MANIFEST}.tmp" || true
          else
            : > "${MANIFEST}.tmp"
          fi
          echo "$NEW_LINE" >> "${MANIFEST}.tmp"
          LC_ALL=C sort -o "$MANIFEST" "${MANIFEST}.tmp"
          rm "${MANIFEST}.tmp"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          base: master
          branch: browserchooser-${{ steps.version.outputs.version }}
          commit-message: 'x11-misc/browserchooser: add ${{ steps.version.outputs.version }}'
          committer: 'Andrew Udvare <audvare@gmail.com>'
          path: gentoo
          signoff: true
          title: 'x11-misc/browserchooser: add ${{ steps.version.outputs.version }}'
          token: ${{ secrets.GENTOO_TOKEN }}
          body: |
            This PR was automatically created from the [Browser Chooser ${{ steps.version.outputs.tag }} release](${{ github.event.release.html_url }}).

            Signed-off-by: Andrew Udvare <audvare@gmail.com>

            Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}

            * [x] I can submit this contribution in agreement with the [Copyright Policy](https://www.gentoo.org/glep/glep-0076.html#certificate-of-origin).
            * [x] I have certified the above via adding a `Signed-off-by` line to _every_ commit in the pull request.
            * [x] This contribution has not been created with the assistance of Natural Language Processing artificial intelligence tools, in accordance with the [AI policy](https://wiki.gentoo.org/wiki/Project:Council/AI_policy).
            * [x] I have run `pkgcheck scan --commits --net` to check for issues with my commits.
          push-to-fork: Tatsh/gentoo
name: Add new ebuild to Portage
'on':
  release:
    types:
      - 'published'
permissions:
  contents: read
