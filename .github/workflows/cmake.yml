---
concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref }}'
  queue: 'max'
jobs:
  build-macos:
    name: 'Build (macOS)'
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        run: brew install extra-cmake-modules qt
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          CPACK_SYSTEM: '${{ matrix.os.cpack_system }}'
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            --install-prefix "${GITHUB_WORKSPACE}"/build/prefix \
            -DCPACK_SYSTEM_NAME="${CPACK_SYSTEM}"
          cmake --build build --config "${BUILD_TYPE}" --verbose
          cmake --install "${GITHUB_WORKSPACE}"/build --config "${BUILD_TYPE}" --verbose
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Package
        run: >-
          cpack -C "${BUILD_TYPE}"
          --config "${GITHUB_WORKSPACE}"/build/CPackConfig.cmake --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: browserchooser-${{ matrix.build-type }}-${{ matrix.os.cpack_system }}
          path: |
            ${{github.workspace}}/browserchooser-*.zip
            ${{github.workspace}}/browserchooser-*.dmg
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/browserchooser-*.zip
            ${{github.workspace}}/browserchooser-*.dmg
      - env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes '' || true
          gh release upload "$GITHUB_REF_NAME" --clobber \
            browserchooser-*.zip browserchooser-*.dmg
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        os:
          - cpack_system: Darwin-arm64
            runner: macos-latest
          - cpack_system: Darwin-x86_64
            runner: macos-15-intel
  build-msys:
    name: 'Build (MSYS2)'
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.sys.runner }}
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("$env:GITHUB_WORKSPACE" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: 'pwsh'
      - if: matrix.sys.name == 'clangarm64'
        name: Install NSIS via Chocolatey
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
        shell: 'pwsh'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          install: >-
            make
          msystem: ${{matrix.sys.name}}
          pacboy: >-
            cmake:p
            extra-cmake-modules:p
            ninja:p
            ${{ matrix.sys.name == 'clangarm64' && ' ' || 'nsis:p' }}
            qt6-base:p
            qt6-tools:p
            toolchain:p
            zlib:p
          update: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          CPACK_SYSTEM: '${{ matrix.sys.cpack_system }}'
          WORKSPACE_OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Configure
        run: >-
          cmake -G Ninja -B "$WORKSPACE_OUT/build"
          --install-prefix "$WORKSPACE_OUT/build/prefix"
          -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          -DCPACK_SYSTEM_NAME="${CPACK_SYSTEM}"
          -DFHS=OFF
        shell: msys2 {0}
      - env:
          WORKSPACE_OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Build
        run: cmake --build "$WORKSPACE_OUT/build" --verbose
        shell: msys2 {0}
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          WORKSPACE_OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Install
        run: >-
          cmake --install "$WORKSPACE_OUT/build"
          --config "${BUILD_TYPE}" --verbose
        shell: msys2 {0}
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          WORKSPACE_OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Package
        run: >-
          cpack -C "${BUILD_TYPE}"
          --config "$WORKSPACE_OUT/build/CPackConfig.cmake" --verbose
        shell: msys2 {0}
      # Release binaries link the release CRT. The scan below reports markers such as
      # VCRUNTIME140D or ucrtbased and fails the job when an installed EXE or DLL references a
      # debug runtime.
      - if: matrix.build-type == 'Release'
        name: Check for debug runtime linkage
        run: |
          $markers = @(
            'VCRUNTIME140D',
            'MSVCP140D',
            'VCOMP140D',
            'CONCRT140D',
            'VCCORLIB140D',
            'ucrtbased',
            'MSVCRTD',
            'MSVCPRTD'
          )
          $failed = $false
          $binaries = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/build/prefix" -Recurse -File `
            -Include *.dll, *.exe
          if (-not $binaries) {
            Write-Host '::error::No installed binaries were found to scan.'
            exit 1
          }
          $binaries | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            foreach ($marker in $markers) {
              if ($text.Contains($marker)) {
                Write-Host "::error::$($_.Name) references debug runtime $marker."
                $failed = $true
              }
            }
          }
          if ($failed) {
            exit 1
          }
        shell: 'pwsh'
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: browserchooser-${{ matrix.build-type }}-${{ matrix.sys.name }}
          path: |
            ${{github.workspace}}/browserchooser-*.exe
            ${{github.workspace}}/browserchooser-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/browserchooser-*.exe
            ${{github.workspace}}/browserchooser-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
        if: >-
          ${{ github.ref_type == 'tag' && matrix.sys.release &&
          matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes '' || true
          gh release upload "$GITHUB_REF_NAME" --clobber \
            browserchooser-*.exe browserchooser-*.zip
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - cpack_system: win64
            env: x86_64
            name: mingw64
            release: false
            runner: windows-latest
          - cpack_system: win64
            env: ucrt-x86_64
            name: ucrt64
            release: true
            runner: windows-latest
          - cpack_system: winarm64
            env: clang-aarch64
            name: clangarm64
            release: true
            runner: windows-11-arm
  build-linux:
    name: 'Build (Linux)'
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules lcov tree
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Configure
        run: >-
          cmake -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" -B "${GITHUB_WORKSPACE}"/build
          --install-prefix "${GITHUB_WORKSPACE}"/build/AppDir/usr
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          -DFHS=ON
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Build
        run: cmake --build "${GITHUB_WORKSPACE}"/build --verbose --config "${BUILD_TYPE}"
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Install
        run: cmake --install "${GITHUB_WORKSPACE}"/build --config "${BUILD_TYPE}" --verbose
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Package
        run: >-
          cpack -C "${BUILD_TYPE}"
          --config "${GITHUB_WORKSPACE}"/build/CPackConfig.cmake --verbose
      - name: Create AppImage
        env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
          EXTRA_PLATFORM_PLUGINS: 'libqwayland-generic.so;libqwayland-egl.so'
          EXTRA_QT_PLUGINS: 'wayland-decoration-client;wayland-graphics-integration-client;wayland-shell-integration'
        run: |
          wget "https://github.com/TheAssassin/linuxdeploy/releases/download/continuous/linuxdeploy-${DEPLOY_ARCH}.AppImage"
          wget "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          chmod +x "linuxdeploy-${DEPLOY_ARCH}.AppImage" "linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          QMAKE="$(command -v qmake6)"
          export QMAKE
          "./linuxdeploy-${DEPLOY_ARCH}.AppImage" --appdir "${GITHUB_WORKSPACE}"/build/AppDir --plugin qt --output appimage
          rm "./linuxdeploy-${DEPLOY_ARCH}.AppImage" "./linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          mv -v "${GITHUB_WORKSPACE}"/*.AppImage "${GITHUB_WORKSPACE}/browserchooser-${BUILD_TYPE}-${DEPLOY_ARCH}.AppImage"
      - env:
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
          REF_NAME: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Rename with tag
        run: >-
          mv -v "${GITHUB_WORKSPACE}"/browserchooser-*.AppImage
          "${GITHUB_WORKSPACE}/browserchooser-${REF_NAME}-${DEPLOY_ARCH}.AppImage"
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: browserchooser-${{ matrix.build-type }}-Linux-${{ matrix.arch.deploy_arch }}
          path: |
            ${{github.workspace}}/browserchooser-*.AppImage
            ${{github.workspace}}/browserchooser-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/browserchooser-*.AppImage
            ${{github.workspace}}/browserchooser-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes '' || true
          gh release upload "$GITHUB_REF_NAME" --clobber browserchooser-*.AppImage
    strategy:
      fail-fast: false
      matrix:
        arch:
          - deploy_arch: aarch64
            runner: ubuntu-24.04-arm
          - deploy_arch: x86_64
            runner: ubuntu-latest
        build-type: [Debug, Release]
name: Build
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions:
  contents: read
