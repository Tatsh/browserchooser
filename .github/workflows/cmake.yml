---
jobs:
  build-macos:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        run: brew install extra-cmake-modules qt
      - run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{matrix.build-type}} \
            --install-prefix ${{github.workspace}}/build/prefix \
            -DCPACK_SYSTEM_NAME=${{matrix.os.cpack_system}}
          cmake --build build --config ${{matrix.build-type}} --verbose
          cmake --install ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{github.workspace}}/build/CPackConfig.cmake --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: browserchooser-${{ matrix.build-type }}-${{ matrix.os.cpack_system }}
          path: |
            ${{github.workspace}}/browserchooser-*.zip
            ${{github.workspace}}/browserchooser-*.dmg
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/browserchooser-*.zip
            ${{github.workspace}}/browserchooser-*.dmg
      - env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes '' || true
          gh release upload "$GITHUB_REF_NAME" --clobber \
            browserchooser-*.zip browserchooser-*.dmg
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        os:
          - cpack_system: Darwin-arm64
            runner: macos-latest
          - cpack_system: Darwin-x86_64
            runner: macos-15-intel
  build-msys:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.sys.runner }}
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("${{github.workspace}}" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - if: matrix.sys.name == 'clangarm64'
        name: Install NSIS via Chocolatey
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          install: >-
            make
          msystem: ${{matrix.sys.name}}
          pacboy: >-
            cmake:p
            extra-cmake-modules:p
            ninja:p
            ${{ matrix.sys.name == 'clangarm64' && ' ' || 'nsis:p' }}
            qt6-base:p
            qt6-tools:p
            toolchain:p
            zlib:p
          update: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          WORKSPACE_OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Configure
        run: >-
          cmake -G Ninja -B "$WORKSPACE_OUT/build"
          --install-prefix "$WORKSPACE_OUT/build/prefix"
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}
          -DCPACK_SYSTEM_NAME=${{matrix.sys.cpack_system}}
          -DFHS=OFF
        shell: msys2 {0}
      - env:
          WORKSPACE_OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Build
        run: cmake --build "$WORKSPACE_OUT/build" --verbose
        shell: msys2 {0}
      - env:
          WORKSPACE_OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Install
        run: >-
          cmake --install "$WORKSPACE_OUT/build"
          --config ${{matrix.build-type}} --verbose
        shell: msys2 {0}
      - env:
          WORKSPACE_OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config "$WORKSPACE_OUT/build/CPackConfig.cmake" --verbose
        shell: msys2 {0}
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: browserchooser-${{ matrix.build-type }}-${{ matrix.sys.name }}
          path: |
            ${{github.workspace}}/browserchooser-*.exe
            ${{github.workspace}}/browserchooser-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/browserchooser-*.exe
            ${{github.workspace}}/browserchooser-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
        if: >-
          ${{ github.ref_type == 'tag' && matrix.sys.release &&
          matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes '' || true
          gh release upload "$GITHUB_REF_NAME" --clobber \
            browserchooser-*.exe browserchooser-*.zip
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - cpack_system: win64
            env: x86_64
            name: mingw64
            release: false
            runner: windows-latest
          - cpack_system: win64
            env: ucrt-x86_64
            name: ucrt64
            release: true
            runner: windows-latest
          - cpack_system: winarm64
            env: clang-aarch64
            name: clangarm64
            release: true
            runner: windows-11-arm
  build-linux:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules lcov tree
      - name: Install Qt
        uses: Tatsh/install-qt-action@c06aab43ae9bf6a28175c9cf45dd5936d44e21e9
      - name: Configure
        run: >-
          cmake -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -B ${{github.workspace}}/build
          --install-prefix ${{github.workspace}}/build/AppDir/usr
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          -DFHS=ON
      - name: Build
        run: cmake --build ${{github.workspace}}/build --verbose --config ${{matrix.build-type}}
      - name: Install
        run: cmake --install ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{github.workspace}}/build/CPackConfig.cmake --verbose
      - name: Create AppImage
        env:
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
          EXTRA_PLATFORM_PLUGINS: 'libqwayland-generic.so;libqwayland-egl.so'
          EXTRA_QT_PLUGINS: 'wayland-decoration-client;wayland-graphics-integration-client;wayland-shell-integration'
        run: |
          wget "https://github.com/TheAssassin/linuxdeploy/releases/download/continuous/linuxdeploy-${DEPLOY_ARCH}.AppImage"
          wget "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          chmod +x "linuxdeploy-${DEPLOY_ARCH}.AppImage" "linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          export QMAKE="$(command -v qmake6)"
          "./linuxdeploy-${DEPLOY_ARCH}.AppImage" --appdir ${{github.workspace}}/build/AppDir --plugin qt --output appimage
          rm "./linuxdeploy-${DEPLOY_ARCH}.AppImage" "./linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          mv -v ${{github.workspace}}/*.AppImage "${{github.workspace}}/browserchooser-${{matrix.build-type}}-${DEPLOY_ARCH}.AppImage"
      - env:
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
          REF_NAME: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Rename with tag
        run: >-
          mv -v ${{github.workspace}}/browserchooser-*.AppImage
          "${{github.workspace}}/browserchooser-${REF_NAME}-${DEPLOY_ARCH}.AppImage"
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: browserchooser-${{ matrix.build-type }}-Linux-${{ matrix.arch.deploy_arch }}
          path: |
            ${{github.workspace}}/browserchooser-*.AppImage
            ${{github.workspace}}/browserchooser-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/browserchooser-*.AppImage
            ${{github.workspace}}/browserchooser-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes '' || true
          gh release upload "$GITHUB_REF_NAME" --clobber browserchooser-*.AppImage
    strategy:
      fail-fast: false
      matrix:
        arch:
          - deploy_arch: aarch64
            runner: ubuntu-24.04-arm
          - deploy_arch: x86_64
            runner: ubuntu-latest
        build-type: [Debug, Release]
name: Build
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions:
  contents: read
