---
id: sh.tat.browserchooser
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: browserchooser
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=xdg-config/browserchooserrc:create
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - /share/aclocal
  - /share/pkgconfig
  - /share/doc
  - '*.a'
  - '*.la'
modules:
  - name: browserchooser
    builddir: true
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DFHS=ON
    sources:
      - type: git
        url: https://github.com/Tatsh/browserchooser.git
        tag: v0.0.1
        x-checker-data:
          type: git
          tag-pattern: '^v([\d.]+)$'
